<!DOCTYPE html>
<!--
  合并演示文件 - 类别: 个性化地图
  包含 3 个演示: 个性化地图_切换地图个性化样式.html, 个性化地图_墨渊(夜间模式效果).html, 个性化地图_玉露(绿色系活泼风格).html
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>个性化地图 - 合并演示</title>
</head>
<body>

<!-- ============================================
     Demo: 个性化地图_切换地图个性化样式.html
     ============================================ -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>切换地图个性化样式</title>
</head>
<script charset="utf-8" src="https://map.qq.com/api/gljs?v=1.exp&key=OB4BZ-D4W3U-B7VVO-4PJWW-6TKDJ-WPB77"></script>
<style type="text/css">
    html,
    body {
      height: 100%;
      margin: 0px;
      padding: 0px;
      position: relative;
      overflow: hidden;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .btn {
      position: absolute;
      top: 30px;
      z-index: 1001;
      padding: 6px 8px;
    }
    .btn-left {
      left: 30px;
    }
    .btn-right {
      left: 150px;
    }
</style>

<body onload="initMap()">
    <div id="container"></div>
		<input type="button" class="btn btn-left" onclick="changeMapStyle('style2')" value="设置为样式2">
		<input type="button" class="btn btn-right" onclick="changeMapStyle('style3')" value="设置为样式3">
		<script type="text/javascript">
			var map;

			function initMap() {
				var center = new TMap.LatLng(39.984104, 116.307503);
				//初始化地图
				map = new TMap.Map("container", {
                  zoom: 12,//设置地图缩放级别
                  center: center,//设置地图中心点坐标
				});

			}
			
			// 动态设置个性化样式
			function changeMapStyle(styleId) {
				map.setMapStyleId(styleId);
			}
    </script>
</body>

</html>

<!-- ============================================
     Demo: 个性化地图_墨渊(夜间模式效果).html
     ============================================ -->
<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>墨渊(夜间模式效果)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<style type="text/css">
html,body{
  width:100%;
  height:100%;
  position: relative;
  overflow: hidden;
}
*{
  margin:0px;
  padding:0px;
}
body {
  font: 12px/16px Verdana, Helvetica, Arial, sans-serif;
}
#container{
  position: relative;
  width: 100%;
  height: 100%;
}
</style>
<script charset="utf-8" src="https://map.qq.com/api/gljs?v=1.exp&key=OB4BZ-D4W3U-B7VVO-4PJWW-6TKDJ-WPB77"></script>
<script>
  window.onload = function () {
    function init() {
      var map = new TMap.Map(document.getElementById("container"), {
        center: new TMap.LatLng(39.916527, 116.397128),  
        zoom: 11,    
        mapStyleId: 'style2'  
      });
    }
    init();
  }
</script>
</head>
<body>
<div id="container"></div>
</body>
</html>
