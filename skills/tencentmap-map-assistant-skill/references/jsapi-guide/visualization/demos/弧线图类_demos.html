<!-- ============================================
     Demo: 动态设置弧线图参数.html
     ============================================ -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>动态设置弧线图参数</title>
</head>
<script charset="utf-8"
  src="https://map.qq.com/api/gljs?v=1.exp&key=OB4BZ-D4W3U-B7VVO-4PJWW-6TKDJ-WPB77&libraries=visualization"></script>
<style type="text/css">
  html,
  body {
    height: 100%;
    margin: 0px;
    padding: 0px;
  }

  #container {
    width: 100%;
    height: 100%;
  }

  #curAddBtn {
    position: absolute;
    left: 50px;
    top: 50px;
    z-index: 1001;
  }

  #curDecBtn {
    position: absolute;
    left: 150px;
    top: 50px;
    z-index: 1001;
  }

  #aniSwitchBtn {
    position: absolute;
    left: 50px;
    top: 90px;
    z-index: 1001;
  }

</style>

<body onload="initMap()">
  <div id="container">
    <button id="curAddBtn">增加曲度</button>
    <button id="curDecBtn">减小曲度</button>
    <button id="aniSwitchBtn">改变动画总时长与高亮时长</button>
  </div>
  <script src="https://mapapi.qq.com/web/lbs/visualizationApi/demo/data/arc.js"></script>
  <script>
    function initMap() {
      var center = new TMap.LatLng(37.80787, 112.269029);
      var data = arcData;
      var curAddBtn = document.getElementById('curAddBtn');
      var curDecBtn = document.getElementById('curDecBtn');
      var aniSwitchBtn = document.getElementById('aniSwitchBtn');

      //初始化地图
      var map = new TMap.Map("container", {
        zoom: 5,//设置地图缩放级别
        pitch: 30,
        center: center,//设置地图中心点坐标
        mapStyleId: "style4", //个性化样式
         baseMap: {
            		type: "vector",
            		features: ["base", "building3d"], // 隐藏矢量文字
          		},
      });
      //初始化弧线图并添加至map图层
      var arc = new TMap.visualization.Arc({
        animatable: true,
        mode: 'vertical' // 弧线平面与地平面垂直
      })
      .addTo(map)
      .setData(data);//设置数据

      curAddBtn.addEventListener('click', () => {
        var curvature = arc.getCurvature() + 0.1;
        if(curvature <= 1) {  // 曲度最大不能超过1
          arc.setCurvature(curvature);  // 调用参数访问器，设置弧线图的曲度
        }
      });

      curDecBtn.addEventListener('click', () => {
        var curvature = arc.getCurvature() - 0.1;
        if(curvature > 0) {   // 曲度最小不能低于0
          arc.setCurvature(curvature);  // 调用参数访问器，设置弧线图的曲度
        }
      });

      aniSwitchBtn.addEventListener('click', () => {
        var highlight = arc.getHighlightDuration() + 5000;  // 给高亮时间增加5s
        var animDuration = arc.getAnimDuration() + 10000;   // 给动画总时间增加10s
         arc.setAnimDuration(animDuration);
        arc.setHighlightDuration(highlight);  // 调用参数访问器进行设置
       
      })
    }
    </script>
</body>

</html>

     Demo: 弧线中点位置标记.html
     ============================================ -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>弧线中点位置标记</title>
</head>
<script charset="utf-8"
  src="https://map.qq.com/api/gljs?v=1.exp&key=OB4BZ-D4W3U-B7VVO-4PJWW-6TKDJ-WPB77&libraries=visualization"></script>
<style type="text/css">
  html,
  body {
    height: 100%;
    margin: 0px;
    padding: 0px;
  }

  #container {
    width: 100%;
    height: 100%;
  }
</style>

<body onload="initMap()">
  <div id="container"></div>
  <script src="https://mapapi.qq.com/web/lbs/visualizationApi/demo/data/arc.js"></script>
  <script>
    function initMap() {
      var center = new TMap.LatLng(37.80787, 112.269029);
      var data = arcData;
      //初始化地图
      var map = new TMap.Map("container", {
        zoom: 5, //设置地图缩放级别
        pitch: 30,
        center: center, //设置地图中心点坐标
        mapStyleId: "style4", //个性化样式
        baseMap: {
          type: "vector",
          features: ["base", "building3d"], // 隐藏矢量文字
        },
      });
      //初始化弧线图并添加至map图层
      var arc = new TMap.visualization.Arc({
        mode: "vertical", // 弧线平面与地平面垂直
      })
        .addTo(map)
        .setData(data); //设置数据
      var date = arc.getMidPositions().slice(0, 10); // 截取10条数据
      let geometries = [];
      date.forEach((i, index) => {
        let count = data[index].count.toString(); //获取文本
        var marker = {
          //每个marker位置及文本
          position: i, //标注点位置
          content: count, //标注点文本
        };
        geometries.push(marker);
      });

      //初始化点标记
      var marker = new TMap.MultiMarker({
        map: map, //显示Marker图层的底图
        styles: {
          default: new TMap.MarkerStyle({
            width: 70, //宽度
            height: 26, //高度
            anchor: { x: 36, y: 32 }, //标注点图片的锚点位置
            src: "https://mapapi.qq.com/web/lbs/visualizationApi/demo/img/ellipse.png", ////标注点图片url或base64地址
            color: "#fff", ////标注点文本颜色
            size: 16, //标注点文本文字大小
            offset: { x: 0, y: 1 }, //标注点文本文字基于direction方位的偏移属性
          }),
        },
        geometries: geometries, //点标注数据数组
      });
    }
  </script>
</body>

</html>

     Demo: 弧线图点击事件.html
     ============================================ -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>弧线图点击事件</title>
</head>
<script charset="utf-8"
    src="https://map.qq.com/api/gljs?v=1.exp&key=OB4BZ-D4W3U-B7VVO-4PJWW-6TKDJ-WPB77&libraries=visualization"></script>
<style type="text/css">
    html,
    body {
        height: 100%;
        margin: 0px;
        padding: 0px;
    }

    #container {
        width: 100%;
        height: 100%;
    }
    #info{
        display: none;
        position: absolute;
        left: 30px;
        top: 30px;
        background: #fff;
        border-radius: 5px;
        padding: 10px;
    }
</style>

<body onload="initMap()">
    <div id="container"></div>
    <div id="info"></div>
    <script src="https://mapapi.qq.com/web/lbs/visualizationApi/demo/data/arc.js"></script>
    <script>
        function initMap() {
            var center = new TMap.LatLng(37.80787, 112.269029);
            var infoDom = document.getElementById('info');

            var data = arcData;
            //初始化地图
            var map = new TMap.Map("container", {
                zoom: 5,//设置地图缩放级别
                pitch: 30,
                center: center,//设置地图中心点坐标
                mapStyleId: "style4", //个性化样式
               baseMap: {
            		type: "vector",
            		features: ["base", "building3d"], // 隐藏矢量文字
          		},
            });
            //初始化弧线图并添加至map图层
            var arc = new TMap.visualization.Arc({
                animatable: true,
                mode: 'vertical', // 弧线平面与地平面垂直
		            selectOptions: { //拾取配置
				            action: 'click', //拾取动作
				            style: { //选中样式
						            width: 6,
						            color: "#1CD5FF",
						            animateColor: "#A8EFFF"
				            },
				            enableHighlight: false //是否使用高亮效果
		            }

            })
            .addTo(map)
            .setData(data);//设置数据

            // 绑定事件
            arc.on('click', evt => {
                var aggregator = evt && evt.detail && evt.detail.arc;
                if (aggregator) {
                    infoDom.style.display = 'block';
                    infoDom.innerHTML = '弧线数据值： ' + aggregator.count;
                } else {
                    infoDom.style.display = null;
                }
            });
        }
    </script>
</body>

</html>

     Demo: 弧线流向组合图.html
     ============================================ -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>弧线流向组合图</title>
  </head>
  <script
    charset="utf-8"
    src="https://map.qq.com/api/gljs?v=1.exp&key=OB4BZ-D4W3U-B7VVO-4PJWW-6TKDJ-WPB77&libraries=visualization"
  ></script>
  <style type="text/css">
    html,
    body {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }
    #container {
      width: 100%;
      height: 100%;
    }
    #name {
      position: absolute;
      bottom: 10px;
      right: 20px;
      font-size: 12px;
      color: #ffffff;
    }
  </style>
  <body onload="initMap()">
    <div id="container"></div>
    <div id="name">北京市人口迁出图</div>
    <script src="https://mapapi.qq.com/web/lbs/visualizationApi/demo/data/migration.js"></script>
    <script>
      function initMap() {
        //初始化地图
        var map = new TMap.Map("container", {
          zoom: 5, //设置地图缩放级别
          pitch: 46.9, //地图俯仰角度
          rotation: 13.6, //地图在水平面上的旋转角度
          center: new TMap.LatLng(34.07471242503055, 108.65100505987527), //设置地图中心点坐标
          mapStyleId: "style4", //个性化样式
          renderOptions: {
            enableBloom: true, // 泛光
          },
          baseMap: {
            type: "vector",
            features: ["base", "building3d"], // 隐藏矢量文字
          },
        });

        //初始化弧线图并添加至map图层
        var arc = new TMap.visualization.Arc({
          pickStyle: function (item) {
            //轨迹图样式映射函数
            var style;
            if (item.count < 7000) {
              style = {
                width: 2,
                color: "rgba(230,129,28,0.1)",
                animateColor: "#FFCA1F",
              };
            } else {
              style = {
                width: 2,
                color: "rgba(1,124,247,0.1)",
                animateColor: "#1DFAF2",
              };
            }
            return style;
          },
          enableBloom: true, //泛光
          processAnimation: {
            duration: 2000, //动画时长
            tailFactor: 0.7, //尾迹比例
          },
          mode: "vertical", // 弧线平面与地平面垂直,
        })
          .addTo(map)
          .setData(arcData); //设置数据

        // 初始化辐射圈
        var radiationCircle = new TMap.visualization.Radiation({
          styles: {
            default: {
              fillColor: "rgba(0,0,0,0)", // 辐射圈填充颜色
              strokeColor: "#FFF", // 辐射圈边线颜色
              strokeWidth: 25536, //	区域边线宽度
            },
          },
          number: 2, // 每一时刻，辐射圈的同心圆个数
        })
          .addTo(map)
          .setData(radiationData);

        //初始化散点图
        var dot = new TMap.visualization.Dot({
          styles: {
            default: {
              fillColor: "#FFF", //圆形填充颜色
              radius: 2, //圆形半径
            },
          },
          enableBloom: true, // 泛光
        })
          .addTo(map)
          .setData(dotData); //设置数据
      }
    </script>
  </body>
</html>
